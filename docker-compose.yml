version: "3.8"

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    # MinIO (S3-compatible)
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_DEFAULT_REGION: us-east-1

    DATA_DIR: /opt/airflow/data
    LOG_DIR: /opt/airflow/logs

    MINIO_ENDPOINT: http://minio:9000
    PG_URL: jdbc:postgresql://postgres-app:5432/postgres

    PG_HOST: postgres-app
    PG_PORT: "5432"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data:ro
    - ./jars:/opt/airflow/jars
    
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # -------------------------
  # Airflow Metadata Postgres
  # -------------------------
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  # -------------------------
  # Your Application Postgres
  # -------------------------
  postgres-app:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-app-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # exposed to host
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    restart: always

  # -------------------------
  # Airflow Init
  # -------------------------
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    restart: "no"

  # -------------------------
  # Airflow Webserver
  # -------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------
  # Airflow Scheduler
  # -------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------
  # MinIO
  # -------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    # command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always

  # -------------------------
  # Apache Zeppelin
  # -------------------------
  zeppelin:
    image: apache/zeppelin:0.12.1
    environment:
      ZEPPELIN_IN_DOCKER: "true"
      ZEPPELIN_NOTEBOOK_DIR: /notebook
    volumes:
      - ./zeppelin/notebook:/notebook
    ports:
      - "8081:8080"
    restart: always
    
volumes:
  postgres-airflow-data:
  postgres-app-data:
  minio-data:
